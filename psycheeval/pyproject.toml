[project]
name = "psycheeval"
version = "0.1.0"
description = "Synthetic-first evaluation of whether personality profiles improve AI assistant behavior without increasing sycophancy, caricature, or over-personalization."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "orjson>=3.10",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
psycheeval = "psycheeval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psycheeval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
