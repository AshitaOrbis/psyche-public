<!DOCTYPE html>
<html>
<head>
  <title>Psyche Data Recovery</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow: auto; max-height: 300px; font-size: 0.8rem; }
    button { padding: 0.75rem 1.5rem; background: #2563eb; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 1rem; margin: 0.5rem 0.5rem 0.5rem 0; }
    button:hover { background: #1d4ed8; }
    .success { color: #059669; font-weight: 600; }
    .error { color: #dc2626; font-weight: 600; }
    .info { color: #6b7280; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>Psyche Data Recovery</h1>
  <p class="info">This page reads saved test data from this port's localStorage.</p>
  <div id="status"></div>
  <div id="actions" style="display:none">
    <button onclick="downloadData()">Download Data</button>
    <button onclick="copyData()">Copy to Clipboard</button>
  </div>
  <pre id="preview"></pre>

  <script>
    const statusEl = document.getElementById('status');
    const actionsEl = document.getElementById('actions');
    const previewEl = document.getElementById('preview');
    let recoveredData = null;

    // Try to read the psyche-store from localStorage
    const raw = localStorage.getItem('psyche-store');
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        // Zustand persist v5 wraps in { state: {...}, version: 0 }
        const state = parsed.state ?? parsed;
        const sessionCount = Object.keys(state.sessions || {}).length;
        const resultCount = Object.keys(state.results || {}).length;

        if (sessionCount > 0 || resultCount > 0) {
          recoveredData = {
            sessions: state.sessions || {},
            results: state.results || {},
            recoveredFrom: window.location.origin,
            recoveredAt: Date.now(),
          };

          statusEl.textContent = '';
          const p1 = document.createElement('p');
          p1.className = 'success';
          p1.textContent = 'Found data at ' + window.location.origin + '!';
          const p2 = document.createElement('p');
          p2.textContent = sessionCount + ' sessions, ' + resultCount + ' completed results';
          const p3 = document.createElement('p');
          p3.textContent = 'Completed instruments: ' + (Object.keys(state.results || {}).join(', ') || 'none');
          const p4 = document.createElement('p');
          p4.textContent = 'In-progress instruments: ' + (Object.keys(state.sessions || {}).filter(k => !state.results?.[k]).join(', ') || 'none');
          statusEl.append(p1, p2, p3, p4);
          actionsEl.style.display = 'block';
          previewEl.textContent = JSON.stringify(recoveredData, null, 2);
        } else {
          statusEl.textContent = 'Store exists but has no test data.';
          statusEl.className = 'error';
        }
      } catch (e) {
        statusEl.textContent = 'Failed to parse store: ' + e.message;
        statusEl.className = 'error';
        // Don't dump the raw blob on screen by default — it may contain
        // highly personal free-text responses. Require an explicit click.
        const showBtn = document.createElement('button');
        showBtn.textContent = 'Show raw data';
        showBtn.onclick = () => { previewEl.textContent = raw; showBtn.remove(); };
        statusEl.append(document.createElement('br'), showBtn);
      }
    } else {
      statusEl.textContent = 'No psyche-store found at ' + window.location.origin;
      statusEl.className = 'error';
    }

    function downloadData() {
      if (!recoveredData) return;
      const blob = new Blob([JSON.stringify(recoveredData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `psyche-recovered-${window.location.port}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function copyData() {
      if (!recoveredData) return;
      // Warn before placing personal test data on the shared clipboard —
      // other apps (and some sites, with permission) can read it.
      if (!confirm('This copies your full test data (including any free-text answers) to the system clipboard, where other applications may read it. Continue?')) {
        return;
      }
      navigator.clipboard.writeText(JSON.stringify(recoveredData, null, 2))
        .then(() => alert('Copied to clipboard!'))
        .catch((e) => alert('Copy failed: ' + (e && e.message ? e.message : 'clipboard permission denied') + '. Use Download Data instead.'));
    }
  </script>
</body>
</html>
